name: "🦉 Nightly Quality Suite"
run-name: "${{ github.actor }} running nightly QA"

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: "🦉 Reusable Nightly QA (PHP ${{ matrix.php-version }})"
    uses: ./.github/workflows/reusable-checks.yaml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires php >=8.4, so both versions that satisfies have to be covered.
        php-version: ['8.4', '8.5']
    with:
      php_version: ${{ matrix.php-version }}
