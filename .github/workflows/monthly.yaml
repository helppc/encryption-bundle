name: "🦉 Monthly Quality Suite"
run-name: "${{ github.actor }} running monthly QA"

on:
  schedule:
    # 03:00 UTC on the first day of every month.
    - cron: '0 3 1 * *'
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: "🦉 Reusable Monthly QA (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony-version }})"
    uses: ./.github/workflows/reusable-checks.yaml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires php >=8.4, so both versions that satisfies have to be covered.
        php-version: ['8.4', '8.5']
        symfony-version: ['7.4.*', '8.*']
    with:
      php_version: ${{ matrix.php-version }}
      symfony_version: ${{ matrix.symfony-version }}
