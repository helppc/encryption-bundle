name: "🛡️ Reusable Quality Checks"

on:
  workflow_call:
    inputs:
      php_version:
        required: true
        type: string
      symfony_version:
        description: 'Symfony version the whole stack is pinned to, as a Flex constraint (for example "7.4.*").'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  composer-install-args: "--no-progress --no-interaction --prefer-dist --no-scripts"
  php-extensions: "sodium"

jobs:
  composer:
    name: "🏗 PHP & Composer Setup"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 👞 Checkout

      - name: 📅 Setup PHP ${{ inputs.php_version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ env.php-extensions }}
          tools: composer

      - name: 🧪 Composer Validate
        run: composer validate --strict

      # Flex reads SYMFONY_REQUIRE and holds the transitive components to it too, not just the ones
      # composer.json names, so the job tests one whole stack rather than a mix.
      - name: 🎼 Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: 📀 Install Dependencies (Symfony ${{ inputs.symfony_version }})
        env:
          SYMFONY_REQUIRE: ${{ inputs.symfony_version }}
        run: composer update ${{ env.composer-install-args }}

      - name: 🛡️ Composer Audit
        run: composer audit

  check:
    needs: composer
    name: "🛡️ Static Analysis"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: 👞 Checkout

      - name: 📅 Setup PHP ${{ inputs.php_version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ env.php-extensions }}
          tools: composer

      - name: 🎼 Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

      - name: 📀 Install Dependencies (Symfony ${{ inputs.symfony_version }})
        env:
          SYMFONY_REQUIRE: ${{ inputs.symfony_version }}
        run: composer update ${{ env.composer-install-args }}

      - name: 🔍 PHPStan Analysis
        id: phpstan
        run: composer phpstan

      - name: 🛃 Code Style (PHPCS)
        id: phpcs
        if: success() || steps.phpstan.outcome == 'failure'
        run: composer phpcs

      - name: ♻️ Rector (dry run)
        id: rector
        if: success() || steps.phpstan.outcome == 'failure' || steps.phpcs.outcome == 'failure'
        run: composer rector:check

      - name: 🧪 Unit Tests
        if: success() || steps.phpstan.outcome == 'failure' || steps.phpcs.outcome == 'failure' || steps.rector.outcome == 'failure'
        run: composer phpunit
