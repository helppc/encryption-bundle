name: 👤 Assign PR Author

on:
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
    types: [ opened ]

concurrency:
  group: "${{ github.workflow }}-${{github.head_ref || github.ref_name}}-assign-pr-author"
  cancel-in-progress: false

# The action calls issues.addAssignees, which is the issues endpoint applied to a pull request,
# so both scopes are needed. Nothing here checks the repository out, hence no contents access.
permissions:
  issues: write
  pull-requests: write

jobs:
  assignAuthor:
    name: Assign Author
    runs-on: ubuntu-24.04
    steps:
      - name: Assign Author
        uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160 # v1.6.2
