name: "🛡️ Code Quality Assurance"
run-name: "${{ github.actor }} running 🛡️ Code Quality Assurance"

on:
  push:
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-checks.yaml'
      - '**/*.php'
      - 'src'
      - 'tests'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - 'rector.php'
    branches:
      - main

  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/ci.yaml'
      - '.github/workflows/reusable-checks.yaml'
      - '**/*.php'
      - 'src'
      - 'tests'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpstan.neon'
      - 'phpunit.xml'
      - 'rector.php'

  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: "🔎 QA Checks (PHP ${{ matrix.php-version }})"
    uses: ./.github/workflows/reusable-checks.yaml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires php >=8.4, so both versions that satisfies have to be covered.
        php-version: ['8.4', '8.5']
    with:
      php_version: ${{ matrix.php-version }}
