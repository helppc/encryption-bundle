version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    assignees:
      - tomas-kulhanek
    schedule:
      interval: "weekly"
      day: monday
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"

  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and keeps the version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - tomas-kulhanek
    schedule:
      interval: "weekly"
      day: monday
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
