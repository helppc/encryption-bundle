version: 2
# Note: spaze/encryption is pulled from the helppc/encryption fork as a dev branch over VCS.
# Dependabot cannot update that, so it has to be watched by hand until the fork is on Packagist.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    reviewers:
      - tomas-kulhanek
    schedule:
      interval: "weekly"
      day: monday
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"

  - package-ecosystem: github-actions
    directory: "/"
    assignees:
      - tomas-kulhanek
    reviewers:
      - tomas-kulhanek
    schedule:
      interval: weekly
      day: monday
